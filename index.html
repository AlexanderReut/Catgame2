<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Соедини по цифрам</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         font-family:'Segoe UI',sans-serif; background:linear-gradient(135deg,#1a1a2e,#16213e); color:#eee; }
  h1 { margin:12px 0 4px; font-size:clamp(18px,4vw,28px); }
  #hud { display:flex; gap:18px; font-size:16px; margin-bottom:8px; }
  #hud span { background:#0f3460; padding:4px 14px; border-radius:20px; }
  canvas { background:#fff; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.5);
           touch-action:none; cursor:pointer; max-width:95vw; }
  #msg { height:26px; margin-top:10px; font-size:17px; text-align:center; }
  button { margin:6px 4px 16px; padding:9px 20px; border:none; border-radius:20px;
           background:#e94560; color:#fff; font-size:15px; cursor:pointer; }
  button:hover { background:#ff6b81; }
</style>
</head>
<body>
<h1>🎨 Соедини точки по цифрам</h1>
<div id="hud">
  <span>Нужна точка: <b id="need">1</b></span>
  <span>Ошибки: <b id="err">0</b></span>
</div>
<canvas id="cv" width="500" height="500"></canvas>
<div id="msg">Соединяй точки по порядку!</div>
<div>
  <button onclick="loadLevel(level-1)">◀ Назад</button>
  <button onclick="restart()">Заново</button>
  <button onclick="loadLevel(level+1)">Вперёд ▶</button>
</div>
<script>
const levels = [
  { name:"Звезда", pts:[[250,60],[313,252],[485,252],[344,363],[398,495],[250,410],[102,495],[156,363],[15,252],[187,252]] },
  { name:"Домик", pts:[[250,50],[440,170],[440,450],[60,450],[60,170]] },
  { name:"Кораблик", pts:[[250,40],[380,180],[300,180],[460,420],[40,420],[200,180],[120,180]] }
];
const COLORS = ["#e63946","#f77f00","#fcbf49","#2a9d8f","#4361ee","#9d4edd","#e63946","#f77f00","#fcbf49","#2a9d8f","#4361ee","#9d4edd"];
let level=0, pts=[], need=1, err=0, R=22, shake=0, done=false, cw=500, ch=500;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const msg=document.getElementById('msg');

function resize(){
  const w=Math.min(cv.parentElement.clientWidth*0.95,520);
  cv.style.width=w+'px'; cv.style.height=w+'px';
}
window.addEventListener('resize',()=>{resize();draw();});

function loadLevel(n){
  if(n<0||n>=levels.length) return;
  level=n; restart();
  msg.textContent='Уровень: '+levels[n].name;
}
function restart(){
  pts=levels[level].pts.map(p=>[...p]);
  need=1; err=0; done=false; shake=0;
  document.getElementById('need').textContent=1;
  document.getElementById('err').textContent=0;
  draw();
}
function pos(e){
  const r=cv.getBoundingClientRect();
  const x=(e.clientX??e.touches[0].clientX)-r.left;
  const y=(e.clientY??e.touches[0].clientY)-r.top;
  return [x/r.width*cw, y/r.height*ch];
}
function findDot(x,y){
  for(let i=0;i<pts.length;i++)
    if((x-pts[i][0])**2+(y-pts[i][1])**2 < (R+14)**2) return i+1;
  return -1;
}
cv.addEventListener('pointerdown',e=>{
  if(done) return;
  const [x,y]=pos(e), n=findDot(x,y);
  if(n===need){
    if(n>1) drawLine(pts[n-2],pts[n-1],COLORS[n-2]);
    need++;
    document.getElementById('need').textContent = need<=pts.length?need:'✔';
    if(need>pts.length){
      done=true; draw();
      msg.textContent='🎉 Готово! «'+levels[level].name+'» собрана!';
    }
  } else if(n>0){
    err++; shake=12;
    document.getElementById('err').textContent=err;
    msg.textContent='Не та цифра! Нужна '+need;
  } else {
    msg.textContent='Тыкай прямо в точки 🙂';
  }
});

function drawLine(a,b,c){
  ctx.strokeStyle=c; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
}
function draw(t){
  ctx.clearRect(0,0,cw,ch);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cw,ch);
  const off = shake? Math.sin(Date.now()/30)*shake : 0;
  // прогресс-подсказка: пунктир к следующей точке
  if(!done && need<=pts.length){
    const a=need>1?pts[need-2]:pts[0];
    ctx.save(); ctx.setLineDash([6,8]); ctx.strokeStyle='#bbb'; ctx.lineWidth=2;
    ctx.beginPath();
    if(need>1){ctx.moveTo(a[0],a[1]);}else{ctx.moveTo(pts[0][0],pts[0][1]);}
    ctx.lineTo(pts[need-1][0],pts[need-1][1]); ctx.stroke(); ctx.restore();
  }
  pts.forEach((p,i)=>{
    const num=i+1, active=(num===need&&!done), passed=num<need;
    ctx.beginPath();
    ctx.arc(p[0]+(active?off:0),p[1],R,0,Math.PI*2);
    ctx.fillStyle = passed?COLORS[i-1]:(active?'#ffd166':'#e9ecef');
    ctx.fill();
    ctx.lineWidth=3;
    ctx.strokeStyle = passed?COLORS[i-1]:(active?'#e94560':'#adb5bd');
    ctx.stroke();
    ctx.fillStyle = passed?'#fff':(active?'#333':'#555');
    ctx.font='bold 15px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(num,p[0]+(active?off:0),p[1]);
  });
  if(shake>0) shake*=0.85;
  requestAnimationFrame(draw);
}
resize(); loadLevel(0);
</script>
</body>
</html>
