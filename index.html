<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Соедини точки по цифрам</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-family: system-ui, sans-serif;
    background: #101418;
    color: #eaf2f8;
  }
  h1 { font-size: 22px; margin: 0; }
  .panel {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    border: 0;
    border-radius: 10px;
    padding: 10px 16px;
    font-weight: 700;
    cursor: pointer;
    background: #2f80ed;
    color: white;
  }
  button:hover { background: #1f6fd6; }
  #status { min-height: 24px; font-weight: 600; }
  canvas {
    background: #f6f7fb;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,.35);
    touch-action: none;
    max-width: 94vw;
  }
</style>
</head>
<body>
  <h1>Соедини точки по цифрам</h1>
  <div id="status">Выберите точку, затем её пару с такой же цифрой.</div>
  <canvas id="game" width="720" height="520"></canvas>
  <div class="panel">
    <button id="restart">Новая игра</button>
    <button id="undo">Отменить линию</button>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

const COLORS = [
  '#e63946', '#2a9d8f', '#457b9d', '#f4a261',
  '#9b5de5', '#00b4d8', '#e76f51', '#80ed99'
];

let dots = [];
let connections = [];
let selected = null;
let hoverDot = null;
let mouse = { x: 0, y: 0 };

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function generateLevel(pairCount = 5) {
  dots = [];
  connections = [];
  selected = null;

  const margin = 70;
  const width = canvas.width;
  const height = canvas.height;

  for (let n = 1; n <= pairCount; n++) {
    for (let k = 0; k < 2; k++) {
      let p, ok = false, guard = 0;

      while (!ok && guard++ < 500) {
        p = {
          x: randomInt(margin, width - margin),
          y: randomInt(margin, height - margin),
          n
        };
        ok = dots.every(d => Math.hypot(d.x - p.x, d.y - p.y) > 85);
      }

      dots.push(p);
    }
  }
}

function dotAt(x, y) {
  return dots.find(d => Math.hypot(d.x - x, d.y - y) <= 26);
}

function bezierPoints(a, b) {
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const dist = Math.hypot(dx, dy) || 1;

  // Перпендикуляр к прямой между точками
  const nx = -dy / dist;
  const ny = dx / dist;

  const bend = Math.min(120, dist * 0.35);
  const dir = Math.random() < 0.5 ? 1 : -1;

  const c1 = {
    x: a.x + dx * 0.28 + nx * bend * dir,
    y: a.y + dy * 0.28 + ny * bend * dir
  };
  const c2 = {
    x: a.x + dx * 0.72 + nx * bend * dir,
    y: a.y + dy * 0.72 + ny * bend * dir
  };

  return [c1, c2];
}

function sampleBezier(p0, c1, c2, p1, steps = 80) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const mt = 1 - t;
    const x =
      mt ** 3 * p0.x +
      3 * mt ** 2 * t * c1.x +
      3 * mt * t ** 2 * c2.x +
      t ** 3 * p1.x;
    const y =
      mt ** 3 * p0.y +
      3 * mt ** 2 * t * c1.y +
      3 * mt * t ** 2 * c2.y +
      t ** 3 * p1.y;
    pts.push({ x, y });
  }
  return pts;
}

function segmentsIntersect(a, b, c, d) {
  const denominator = (b.x - a.x) * (d.y - c.y) - (b.y - a.y) * (d.x - c.x);
  if (Math.abs(denominator) < 1e-9) return false;

  const t = ((c.x - a.x) * (d.y - c.y) - (c.y - a.y) * (d.x - c.x)) / denominator;
  const u = ((c.x - a.x) * (b.y - a.y) - (c.y - a.y) * (b.x - a.x)) / denominator;

  return t > 0.001 && t < 0.999 && u > 0.001 && u < 0.999;
}

function curvesIntersect(newConn, existingConn) {
  const a = sampleBezier(newConn.a, newConn.c1, newConn.c2, newConn.b, 60);
  const b = sampleBezier(existingConn.a, existingConn.c1, existingConn.c2, existingConn.b, 60);

  for (let i = 0; i < a.length - 1; i++) {
    for (let j = 0; j < b.length - 1; j++) {
      if (segmentsIntersect(a[i], a[i + 1], b[j], b[j + 1])) {
        return true;
      }
    }
  }
  return false;
}

function tryConnect(dot) {
  if (!selected) return;

  if (selected === dot) {
    selected = null;
    statusEl.textContent = 'Выбор отменён.';
    return;
  }

  if (selected.n !== dot.n) {
    statusEl.textContent = `Нужно соединить две точки с цифрой ${selected.n}.`;
    selected = null;
    return;
  }

  const alreadyUsed = connections.some(
    c => (c.a === selected && c.b === dot) || (c.a === dot && c.b === selected)
  );

  if (alreadyUsed) {
    statusEl.textContent = 'Эта пара уже соединена.';
    selected = null;
    return;
  }

  const [c1, c2] = bezierPoints(selected, dot);
  const candidate = { a: selected, b: dot, c1, c2, n: selected.n };

  const crosses = connections.some(conn => curvesIntersect(candidate, conn));

  if (crosses) {
    statusEl.textContent = 'Линии пересекаются! Попробуйте другую пару.';
    selected = null;
    return;
  }

  connections.push(candidate);
  selected = null;

  if (connections.length === dots.length / 2) {
    statusEl.textContent = 'Победа! Все пары соединены без пересечений.';
  } else {
    statusEl.textContent = `Отлично! Осталось пар: ${dots.length / 2 - connections.length}.`;
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Сетка
  ctx.strokeStyle = '#dde3ec';
  ctx.lineWidth = 1;
  for (let x = 40; x < canvas.width; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 40; y < canvas.height; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  // Проведённые кривые
  connections.forEach(conn => {
    ctx.beginPath();
    ctx.moveTo(conn.a.x, conn.a.y);
    ctx.bezierCurveTo(conn.c1.x, conn.c1.y, conn.c2.x, conn.c2.y, conn.b.x, conn.b.y);
    ctx.strokeStyle = COLORS[(conn.n - 1) % COLORS.length];
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.stroke();
  });

  // Предпросмотр
  if (selected && hoverDot && hoverDot !== selected) {
    const [c1, c2] = bezierPoints(selected, hoverDot);
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    ctx.moveTo(selected.x, selected.y);
    ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, hoverDot.x, hoverDot.y);
    ctx.strokeStyle = COLORS[(selected.n - 1) % COLORS.length];
    ctx.lineWidth = 6;
    ctx.setLineDash([10, 8]);
    ctx.stroke();
    ctx.restore();
  }

  // Точки
  dots.forEach(dot => {
    const color = COLORS[(dot.n - 1) % COLORS.length];
    const isSelected = dot === selected;

    ctx.beginPath();
    ctx.arc(dot.x, dot.y, isSelected ? 25 : 21, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = isSelected ? 6 : 4;
    ctx.strokeStyle = color;
    ctx.stroke();

    ctx.fillStyle = color;
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(dot.n, dot.x, dot.y + 1);
  });
}

function pointerPosition(event) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = event.touches ? event.touches[0].clientX : event.clientX;
  const clientY = event.touches ? event.touches[0].clientY : event.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

canvas.addEventListener('pointermove', event => {
  const p = pointerPosition(event);
  mouse = p;
  hoverDot = dotAt(p.x, p.y);
  canvas.style.cursor = hoverDot ? 'pointer' : 'default';
  draw();
});

canvas.addEventListener('pointerdown', event => {
  const p = pointerPosition(event);
  const dot = dotAt(p.x, p.y);

  if (!dot) return;

  if (!selected) {
    selected = dot;
    statusEl.textContent = `Выбрана цифра ${dot.n}. Выберите вторую такую же точку.`;
  } else {
    tryConnect(dot);
  }

  draw();
});

document.getElementById('restart').addEventListener('click', () => {
  generateLevel();
  statusEl.textContent = 'Выберите точку, затем её пару с такой же цифрой.';
  draw();
});

document.getElementById('undo').addEventListener('click', () => {
  connections.pop();
  selected = null;
  statusEl.textContent = 'Последняя линия отменена.';
  draw();
});

generateLevel();
draw();
</script>
</body>
</html>
