<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Соедини точки</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #141414; color: #eee;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; -webkit-user-select: none; user-select: none;
  }
  .hud { margin-top: 14px; text-align: center; }
  .stats { color: #e5384e; font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .stats span { color: #ff5570; }
  h1 { font-weight: 500; font-size: 24px; margin: 6px 0 2px; letter-spacing: 1px; }
  .lvl { color: #888; font-size: 14px; margin-bottom: 8px; }
  canvas { touch-action: none; border-radius: 10px; cursor: pointer; }
  .btns { margin: 14px 0 6px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #262626; color: #eee; border: 1px solid #4a4a4a; border-radius: 8px;
    padding: 10px 16px; font-size: 15px; cursor: pointer; font-family: inherit;
  }
  button:hover { background: #333; }
  button:active { transform: scale(0.97); }
  #win {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 10; text-align: center; padding: 20px;
  }
  #win.hidden { display: none; }
  #winTitle { font-size: 30px; font-weight: 700; color: #ffd54f; }
  #winStats { color: #e5384e; font-size: 19px; font-weight: 600; }
  #hint { color: #777; font-size: 13px; margin: 4px 0 12px; }
</style>
</head>
<body>
  <div class="hud">
    <div class="stats">COVERAGE: <span id="cov">0%</span>&nbsp;&nbsp;MOVES: <span id="mov">0</span></div>
    <h1>СОЕДИНИ ТОЧКИ</h1>
    <div class="lvl" id="lvl">Уровень 1 из 5</div>
  </div>
  <canvas id="cv"></canvas>
  <div id="hint">Тяни от точки к точке того же цвета. Линии не должны пересекаться!</div>
  <div class="btns">
    <button id="prevBtn">&#8249; Уровень</button>
    <button id="resetBtn">Заново</button>
    <button id="nextLvlBtn">Уровень &#8250;</button>
  </div>
  <div id="win" class="hidden">
    <div id="winTitle"></div>
    <div id="winStats"></div>
    <button id="nextBtn">Следующий уровень &#8250;</button>
    <button id="againBtn">Пройти заново</button>
  </div>

<script>
"use strict";
const LEVELS = [{"size":5,"pairs":[[[2,2],[2,4]],[[1,3],[3,4]],[[0,0],[4,0]],[[3,1],[0,1]],[[4,1],[4,4]]]},{"size":6,"pairs":[[[3,0],[3,2]],[[0,4],[3,4]],[[0,3],[1,0]],[[4,5],[5,2]],[[3,3],[2,4]]]},{"size":7,"pairs":[[[1,3],[2,6]],[[3,6],[5,4]],[[5,1],[6,3]],[[3,4],[1,1]],[[4,0],[0,3]],[[3,5],[4,1]]]},{"size":8,"pairs":[[[2,3],[2,1]],[[3,5],[3,7]],[[3,6],[2,4]],[[6,4],[7,2]],[[4,3],[7,0]],[[1,2],[0,6]],[[7,3],[5,4]],[[6,0],[3,1]]]},{"size":9,"pairs":[[[0,5],[1,8]],[[5,8],[8,7]],[[4,3],[8,5]],[[3,2],[4,1]],[[1,3],[3,3]],[[6,2],[8,3]],[[4,7],[5,5]],[[3,7],[4,5]],[[8,6],[6,5]],[[0,1],[1,0]]]}];
const COLORS = ['#e53935','#fdd835','#fb8c00','#5c6bc0','#26c6da','#7cb342',
                '#f48fb1','#d81b60','#d7ccc8','#00897b','#8d6e63','#9575cd'];

let levelIdx = 0, n = 5, pairs = [], paths = [], complete = [], grid = [];
let moves = 0, won = false, dragging = null, modified = false;
let cell = 40, pad = 18, W = 300;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const eq = (a,b) => a.r === b.r && a.c === b.c;
const ctr = i => pad + (i + 0.5) * cell;

function startLevel(i) {
  levelIdx = i;
  const L = LEVELS[i];
  n = L.size;
  pairs = L.pairs.map(pr => [{r: pr[0][0], c: pr[0][1]}, {r: pr[1][0], c: pr[1][1]}]);
  grid = Array.from({length: n}, () => Array(n).fill(-1));
  pairs.forEach((pr, k) => { grid[pr[0].r][pr[0].c] = k; grid[pr[1].r][pr[1].c] = k; });
  paths = pairs.map(() => []);
  complete = pairs.map(() => false);
  moves = 0; won = false; dragging = null;
  document.getElementById('win').classList.add('hidden');
  resize(); draw(); updateHud();
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = Math.min(560, window.innerWidth - 28);
  cell = W / (n + 0.9);
  pad = cell * 0.45;
  cv.width = W * dpr; cv.height = W * dpr;
  cv.style.width = W + 'px'; cv.style.height = W + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function cellAt(x, y) {
  const c = Math.floor((x - pad) / cell), r = Math.floor((y - pad) / cell);
  if (r < 0 || c < 0 || r >= n || c >= n) return null;
  return {r, c};
}

function isPairEnd(k, p) { return eq(pairs[k][0], p) || eq(pairs[k][1], p); }

function updateHud() {
  let filled = 0;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (grid[r][c] !== -1) filled++;
  const pct = Math.round(100 * filled / (n * n));
  document.getElementById('cov').textContent = pct + '%';
  document.getElementById('mov').textContent = moves;
  document.getElementById('lvl').textContent = 'Уровень ' + (levelIdx + 1) + ' из ' + LEVELS.length;
}

function getPos(e) {
  const rect = cv.getBoundingClientRect();
  return {x: e.clientX - rect.left, y: e.clientY - rect.top};
}

cv.addEventListener('pointerdown', e => {
  if (won) return;
  const t = getPos(e), p = cellAt(t.x, t.y);
  if (!p) return;
  const col = grid[p.r][p.c];
  if (col === -1) return;
  const idx = paths[col].findIndex(q => eq(q, p));
  if (idx === -1) {
    if (!isPairEnd(col, p)) return;
    for (const q of paths[col]) if (!isPairEnd(col, q)) grid[q.r][q.c] = -1;
    paths[col] = [p]; complete[col] = false;
  } else {
    for (const q of paths[col].slice(idx + 1)) if (!isPairEnd(col, q)) grid[q.r][q.c] = -1;
    paths[col] = paths[col].slice(0, idx + 1);
    complete[col] = paths[col].length >= 2 && isPairEnd(col, paths[col][paths[col].length - 1]);
  }
  dragging = col; modified = false;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  draw(); updateHud();
});

cv.addEventListener('pointermove', e => {
  if (dragging === null || won) return;
  const t = getPos(e), p = cellAt(t.x, t.y);
  if (!p) return;
  const path = paths[dragging], last = path[path.length - 1];
  if (eq(p, last)) return;
  if (Math.abs(p.r - last.r) + Math.abs(p.c - last.c) !== 1) return;
  // шаг назад по своей же линии
  if (path.length >= 2 && eq(p, path[path.length - 2])) {
    const rm = path.pop();
    if (!isPairEnd(dragging, rm)) grid[rm.r][rm.c] = -1;
    complete[dragging] = path.length >= 2 && isPairEnd(dragging, path[path.length - 1]);
    modified = true; draw(); updateHud(); return;
  }
  const tc = grid[p.r][p.c];
  if (tc !== -1 && tc !== dragging) {
    if (isPairEnd(tc, p)) return; // чужая точка — стена
    const oi = paths[tc].findIndex(q => eq(q, p)); // разрезаем чужую линию
    for (const q of paths[tc].slice(oi)) if (!isPairEnd(tc, q)) grid[q.r][q.c] = -1;
    paths[tc] = paths[tc].slice(0, oi);
    complete[tc] = false; modified = true;
  } else if (tc === dragging) {
    if (isPairEnd(dragging, p) && !eq(p, path[0])) {
      path.push(p); complete[dragging] = true; modified = true;
      dragging = null; draw(); updateHud(); checkWin(); return;
    }
    return; // через свою линию пройти нельзя
  }
  path.push(p); grid[p.r][p.c] = dragging; modified = true;
  draw(); updateHud();
});

function endDrag() {
  if (dragging !== null) {
    dragging = null;
    if (modified) moves++;
    updateHud(); checkWin();
  }
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

function checkWin() {
  if (won || !complete.every(Boolean)) return;
  won = true;
  const last = levelIdx === LEVELS.length - 1;
  document.getElementById('winTitle').textContent = last ? 'Все уровни пройдены!' : 'Уровень пройден!';
  document.getElementById('nextBtn').style.display = last ? 'none' : 'inline-block';
  document.getElementById('winStats').textContent =
    'Coverage: ' + document.getElementById('cov').textContent + '  ·  Moves: ' + moves;
  document.getElementById('win').classList.remove('hidden');
}

function draw() {
  ctx.fillStyle = '#181818';
  ctx.fillRect(0, 0, W, W);
  // сетка
  ctx.strokeStyle = 'rgba(215,55,70,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    ctx.moveTo(pad + i * cell, pad); ctx.lineTo(pad + i * cell, W - pad);
    ctx.moveTo(pad, pad + i * cell); ctx.lineTo(W - pad, pad + i * cell);
  }
  ctx.stroke();
  // линии
  for (let k = 0; k < pairs.length; k++) {
    const path = paths[k];
    if (path.length < 2) continue;
    ctx.strokeStyle = COLORS[k % COLORS.length];
    ctx.lineWidth = cell * 0.48;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(ctr(path[0].c), ctr(path[0].r));
    for (let j = 1; j < path.length; j++) ctx.lineTo(ctr(path[j].c), ctr(path[j].r));
    ctx.stroke();
  }
  // точки
  for (let k = 0; k < pairs.length; k++)
    for (const p of pairs[k]) drawDot(p.r, p.c, k);
}

function drawDot(r, c, k) {
  const x = ctr(c), y = ctr(r), R = cell * 0.33;
  ctx.beginPath(); ctx.arc(x, y, R, 0, 7);
  ctx.fillStyle = COLORS[k % COLORS.length]; ctx.fill();
  ctx.lineWidth = Math.max(2, cell * 0.05);
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(x - R * 0.28, y - R * 0.28, R * 0.45, 0, 7);
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fill();
}

document.getElementById('resetBtn').onclick = () => startLevel(levelIdx);
document.getElementById('prevBtn').onclick = () => startLevel((levelIdx - 1 + LEVELS.length) % LEVELS.length);
document.getElementById('nextLvlBtn').onclick = () => startLevel((levelIdx + 1) % LEVELS.length);
document.getElementById('nextBtn').onclick = () => startLevel(levelIdx + 1);
document.getElementById('againBtn').onclick = () => startLevel(levelIdx);
window.addEventListener('resize', () => { resize(); draw(); });

startLevel(0);
</script>
</body>
</html>
